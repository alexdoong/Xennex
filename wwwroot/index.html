<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xennex</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Titlebar for dragging when not in sidebar mode -->
        <div id="titlebar">
            <div id="drag-region">Xennex</div>
            <button id="btn-minimize" class="title-btn">-</button>
            <button id="btn-close" class="title-btn">x</button>
        </div>

        <!-- Sidebar / Main Content -->
        <div id="content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="osu">osu!</button>
                <button class="tab-btn" data-tab="wuwa">WuWa</button>
                <button class="tab-btn" data-tab="settings">Config</button>
                <button class="tab-btn" data-tab="cloud">Cloud</button>
            </div>

            <!-- Osu Tab -->
            <div id="tab-osu" class="tab-content active">
                <h2>Wacom Drivers</h2>
                <div class="button-group">
                    <button id="btn-enable-wacom" class="btn primary">Enable Wacom</button>
                    <button id="btn-disable-wacom" class="btn danger">Disable Wacom</button>
                </div>
                
                <h2>REAL Engine</h2>
                <div class="status-indicator">
                    <div id="real-status-dot" class="dot red"></div>
                    <span id="real-status-text">Stopped</span>
                </div>
                <div class="button-group">
                    <button id="btn-start-real" class="btn primary">Start REAL</button>
                    <button id="btn-stop-real" class="btn danger">Stop REAL</button>
                </div>
            </div>

            <!-- WuWa Tab -->
            <div id="tab-wuwa" class="tab-content">
                <h2>WuWa Builds</h2>
                <div class="card">
                    <p>Coming Soon (Visual UI in progress)</p>
                </div>
            </div>

            <!-- Settings Tab -->
            <div id="tab-settings" class="tab-content">
                <h2>Settings</h2>
                <label>
                    <input type="checkbox" id="chk-close-to-tray"> Close to Tray
                </label>
                <label>
                    <input type="checkbox" id="chk-hide-pull-tab"> Hide Pull Tab
                </label>
                <label class="switch-container">
                    <span>Sidebar Mode</span>
                    <div class="switch">
                        <input type="checkbox" id="chk-toggle-sidebar">
                        <span class="slider"></span>
                    </div>
                </label>
            </div>

            <!-- Cloud Tab -->
            <div id="tab-cloud" class="tab-content">
                <h2>Cloud Sync</h2>
                <div class="card" style="margin-bottom: 16px;">
                    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
                        Connect to Firebase / Firestore to backup and synchronize your settings and WuWa builds across devices.
                    </p>
                    <div class="input-group">
                        <label>Project ID</label>
                        <input type="text" id="inp-cloud-project" placeholder="e.g. my-project-123" class="modern-input">
                    </div>
                    <div class="input-group">
                        <label>API Key</label>
                        <input type="password" id="inp-cloud-apikey" placeholder="AIzaSyB..." class="modern-input">
                    </div>
                </div>
                
                <div class="status-indicator">
                    <div id="cloud-status-dot" class="dot"></div>
                    <span id="cloud-status-text">Not Connected</span>
                </div>
                
                <div class="button-group">
                    <button id="btn-cloud-connect" class="btn primary">Connect</button>
                    <button id="btn-cloud-disconnect" class="btn danger" style="display:none;">Disconnect</button>
                </div>
            </div>
        </div>
        
        <!-- Pull Tab for sliding out -->
        <div id="pull-tab">
            <div class="pull-tab-line"></div>
            <div class="pull-tab-line"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
